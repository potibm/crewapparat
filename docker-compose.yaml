services:
  # --------------------------------------------------------
  # Traefik Reverse Proxy
  # --------------------------------------------------------
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/.certs:/certs:ro
      - ./infra/traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------------
  # Identity
  # --------------------------------------------------------
  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    volumes:
      - ./infra/dex-config.yaml:/etc/dex/config.docker.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex-crew.rule=Host(`dex.crewapparat.test`)"
      - "traefik.http.routers.dex-crew.entrypoints=websecure"
      - "traefik.http.routers.dex-crew.tls=true"
      - "traefik.http.services.dex-crew.loadbalancer.server.port=5556"

  # --------------------------------------------------------
  # Observability
  # --------------------------------------------------------
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=password123
    volumes:
      - o2_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observe-crew.rule=Host(`observe.crewapparat.test`)"
      - "traefik.http.routers.observe-crew.entrypoints=websecure"
      - "traefik.http.routers.observe-crew.tls=true"
      - "traefik.http.services.observe-crew.loadbalancer.server.port=5080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel-config.yaml:/etc/otel/config.yaml
      - ./backend/logs:/etc/app/logs:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "3417:4317" # OTLP gRPC (Needed for Go backend on host)
      - "3418:4318" # OTLP HTTP (Needed for Vite frontend on host)
    depends_on:
      - openobserve

  # --------------------------------------------------------
  # Data Stores
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: crewapparat_redis
    ports:
      - "3451:6379" # Needed for Go backend on host
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  redisinsight:
    image: redis/redisinsight:latest
    container_name: crewapparat_redisinsight
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_ALIAS0=Crewapparat-Redis
      - RI_REDIS_HOST0=crewapparat_redis
      - RI_REDIS_PORT0=6379
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-crew.rule=Host(`redis.crewapparat.test`)"
      - "traefik.http.routers.redis-crew.entrypoints=websecure"
      - "traefik.http.routers.redis-crew.tls=true"
      - "traefik.http.services.redis-crew.loadbalancer.server.port=5540"

  minio:
    image: minio/minio:latest
    container_name: crewapparat_minio
    ports:
      - "3450:9000" # S3 API (Needed for Go backend on host)
    environment:
      - MINIO_ROOT_USER=local-admin
      - MINIO_ROOT_PASSWORD=local-super-secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-crew.rule=Host(`minio.crewapparat.test`)"
      - "traefik.http.routers.minio-crew.entrypoints=websecure"
      - "traefik.http.routers.minio-crew.tls=true"
      - "traefik.http.services.minio-crew.loadbalancer.server.port=9001"

  minio-init:
    image: minio/mc:latest
    container_name: crewapparat_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local_minio http://minio:9000 local-admin local-super-secret) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local_minio/crewapparat;
      exit 0;
      "

volumes:
  o2_data:
  redis_data:
  redisinsight_data:
  minio_data:
